<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="theme-color" content="#080a0e" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="%SITE_BASE%lazyfox-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%SITE_BASE%img/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/img/og.png" />
    <meta property="og:image:width" content="1848" />
    <meta property="og:image:height" content="1165" />
    <meta property="og:image:alt" content="The Lazyfox command center: a search box over quick-launch sites, drawn without any browser chrome." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%/img/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "%SITE_NAME%",
        "applicationCategory": "BrowserApplication",
        "applicationSubCategory": "Firefox extension",
        "operatingSystem": "Windows, macOS, Linux",
        "description": "%SITE_DESCRIPTION%",
        "url": "%SITE_URL%/",
        "downloadUrl": "https://github.com/YELrhilassi/lazyfox/releases/latest",
        "installUrl": "https://addons.mozilla.org/firefox/addon/lazyfox2/",
        "softwareVersion": "0.5.22",
        "license": "https://opensource.org/license/mit",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Youssef El Rhilassi" }
      }
    </script>
  </head>
  <body>
    <!-- Filled by scripts/prerender.mjs, so the served document already holds
         every word a crawler or a reader needs. main.tsx hydrates it. -->
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
