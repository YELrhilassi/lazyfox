<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Lazyfox</title>
<style>
  :root {
    --bg: #0e1116;
    --bg2: #161922;
    --bg3: #1d2130;
    --panel: #1a1e2a;
    --fg: #d3d7e6;
    --muted: #5f6a85;
    --sub: #9aa3bf;
    --accent: #6d8fdb;
    --green: #8fbf5e;
    --yellow: #d9a85e;
    --magenta: #a98fe0;
    --border: #262b3d;
    --border2: #343b54;
    --sel: #2b3150;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  #wrap {
    width: min(1280px, 100%);
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 4vh 32px 12px;
    position: relative;
  }
  header { display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  .brand { display: flex; align-items: center; }
  .brand .logo {
    height: 64px; width: auto; overflow: hidden; flex: none;
  }
  .brand .logo img { height: 100%; width: auto; object-fit: contain; }
  #state { display: none; }
  #modeTag { font-size: 11px; color: var(--muted); }

  .inputrow {
    display: flex; align-items: center; gap: 10px;
    width: min(560px, 100%); margin: 0 auto;
    background: var(--bg2); border: 1px solid var(--border2); border-radius: 6px;
    padding: 2px 10px;
    transition: border-color .12s ease;
  }
  .inputrow:focus-within { border-color: var(--accent); }
  #inputIcon { font-size: 15px; color: var(--accent); flex: none; line-height: 1; opacity: .9; }
  #input {
    flex: 1; background: transparent; border: none; outline: none; color: var(--fg);
    font: inherit; font-size: 14px; padding: 9px 0; min-width: 0;
  }
  #input::placeholder { color: var(--muted); }

  .modes { display: flex; justify-content: center; gap: 6px; margin: 16px 0 12px; flex-wrap: wrap; }
  .mode-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg2); border: 1px solid var(--border2); color: var(--sub);
    font: 500 12px/1 system-ui, -apple-system, sans-serif; letter-spacing: .02em;
    padding: 7px 14px; border-radius: 8px; cursor: pointer; transition: all .1s ease;
  }
  .mode-btn:hover { color: var(--fg); border-color: var(--border2); background: var(--bg3); }
  .mode-btn.on {
    background: var(--accent); border-color: var(--accent);
    color: #0b0e18; font-weight: 650;
  }
  .mode-btn .mi { font-size: 12px; }

  #results {
    list-style: none; margin: 0; padding: 4px 0 0; flex: 1 1 0; min-height: 0;
    overflow-y: auto; scrollbar-gutter: stable;
  }
  #results::-webkit-scrollbar { width: 9px; }
  #results::-webkit-scrollbar-thumb { background: #333b5e; border-radius: 5px; }
  #results.quick {
    display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px;
    align-content: start; padding-top: 14px;
  }
  .result { height: 46px; padding: 7px 12px; border-left: 3px solid transparent; cursor: pointer; }
  .result.selected { background: var(--sel); border-left-color: var(--accent); }
  #results.quick .result {
    height: auto; min-width: 0; border-left: none; border-radius: 8px; padding: 13px 14px;
    display: flex; align-items: center; gap: 12px; min-height: 56px;
    transition: background .1s ease;
    position: relative;
  }
  /* ;f hint-pick: a small letter badge over each home-grid tile. */
  #results.quick .result .hintkey {
    position: absolute; top: 6px; right: 8px; z-index: 2;
    min-width: 16px; height: 16px; line-height: 16px; text-align: center;
    font: 650 10px ui-monospace, Menlo, Consolas, monospace;
    color: #0b0e18; background: var(--accent); border-radius: 4px;
  }
  #results.quick .result:hover:not(.selected) { background: var(--bg2); }
  #results.quick .result.selected { background: var(--sel); }
  #results.quick .result .ic {
    flex: none; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    font-size: 17px; overflow: hidden; color: var(--sub);
  }
  #results.quick .result .ic img { width: 100%; height: 100%; object-fit: contain; }
  #results.quick .result .tx { min-width: 0; flex: 1; overflow: hidden; }
  #results.quick .sec {
    grid-column: 1 / -1; margin-top: 10px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); border-top: 1px solid var(--border); padding-top: 12px; padding-left: 2px;
    display: flex; align-items: center; gap: 10px;
  }
  #results.quick .sec:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  #results.quick .result .t {
    font-size: 13px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 550;
  }
  #results.quick .result.selected .t { color: #fff; }
  #results.quick .result .k {
    display: inline-block; font-size: 10px; color: var(--accent); background: var(--bg2);
    border: 1px solid var(--border2); border-radius: 4px; padding: 0 6px; margin-bottom: 2px; letter-spacing: .04em;
  }
  #results.quick .result .s { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result .t {
    font-size: 13px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 18px;
  }
  .result.selected .t { color: #fff; }
  .result .s { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 17px; }
  .kbd {
    display: inline-block; min-width: 22px; text-align: center; background: var(--bg2);
    border: 1px solid var(--border2); border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; margin-right: 8px;
    color: var(--accent); font-size: 11px; font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; }
  #empty { flex: 1; text-align: center; color: var(--muted); font-size: 13px; padding-top: 46px; }

  footer {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted); display: flex; gap: 16px; flex-wrap: nowrap; align-items: center;
    white-space: nowrap;
  }
  footer b { color: var(--sub); font-weight: 550; }
  footer .spacer { flex: 1; }
  footer .meta b { color: var(--sub); font-weight: 550; }
  footer .meta { display: inline-flex; gap: 14px; white-space: nowrap; }
  footer .meta .sep { opacity: .5; }
  footer .lead { color: var(--accent); }
  footer .lead b { color: var(--accent); }

  /* First-run install indicator: shown (amber) until the chrome helper lives. */
  #installBanner {
    display: none; margin-top: 10px; width: 100%;
    background: rgba(217,168,94,.08); border: 1px solid rgba(217,168,94,.4); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; color: var(--yellow);
    align-items: center; gap: 10px;
  }
  #installBanner.show { display: flex; }
  #installBanner .ib-icon { font-size: 15px; line-height: 1; }
  #installBanner .ib-tx { flex: 1; min-width: 0; }
  #installBanner .ib-btn {
    background: var(--yellow); color: #16161e; border: none; border-radius: 6px;
    font: 600 12px system-ui, -apple-system, sans-serif; padding: 6px 12px; cursor: pointer; flex: none;
  }
  #installBanner .ib-btn:hover { filter: brightness(1.08); }

  #resizePanel, #movePanel {
    display: none; position: absolute; right: 28px; bottom: 84px; width: 320px;
    background: var(--panel); border: 1px solid var(--border2); border-radius: 10px; padding: 14px 16px;
    z-index: 5;
  }
  #resizePanel.on, #movePanel.on { display: block; }
  .rp-head { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  #resizeSize, #movePos { color: var(--accent); font-weight: 600; font-size: 13px; }
  .rp-btns { display: flex; gap: 6px; margin-bottom: 10px; }
  .rp-btns button, #rpMax {
    background: var(--bg2); border: 1px solid var(--border2); color: var(--fg); font: inherit;
    border-radius: 7px; padding: 7px 14px; cursor: pointer;
  }
  .rp-btns button:hover, #rpMax:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="brand">
      <div class="logo" id="brandLogo"></div>
    </div>
    <span id="state" style="display:none"></span>
  </header>

  <div class="inputrow">
    <span id="inputIcon">&#x2315;</span>
    <input id="input" autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="search the web &#x2026;">
  </div>

  <div class="modes" id="modes">
    <button class="mode-btn on" data-mode="search"><span class="mi">&#x2315;</span>Search</button>
    <button class="mode-btn" data-mode="url"><span class="mi">&#x2197;</span>URL</button>
    <button class="mode-btn" data-mode="tabs"><span class="mi">&#x25A4;</span>Tabs</button>
    <button class="mode-btn" data-mode="history"><span class="mi">&#x21BA;</span>History</button>
    <button class="mode-btn" data-mode="bookmarks"><span class="mi">&#x2605;</span>Bookmarks</button>
    <button class="mode-btn" data-mode="downloads"><span class="mi">&#x21E3;</span>Downloads</button>
  </div>

  <ul id="results"></ul>
  <div id="empty" style="display:none"></div>

  <div id="installBanner">
    <span class="ib-icon">&#x26A0;&#xFE0F;</span>
    <span class="ib-tx">Your Lazyfox install is <b>incomplete</b> &mdash; install the chrome helper so leader keys and the which-key menu work everywhere.</span>
    <button class="ib-btn" id="installGo">Open setup</button>
  </div>

  <footer>
    <span><b>hjkl / Enter</b> open</span>
    <span><b>;</b> leader</span>
    <span><b>1-6</b> mode</span>
    <span><b>Esc</b> clear</span>
    <span id="modeTag"></span>
    <span class="spacer"></span>
    <span class="meta" id="footerMeta"></span>
    <span class="lead" id="stealthNote" style="display:none">&#x1F576;&#xFE0F; isolated tab</span>
  </footer>
  <style>html.lf-stealth #stealthNote { display: inline; }</style>

  <div id="resizePanel">
    <div class="rp-head">Resize window &#183; <span id="resizeSize"></span></div>
    <div class="rp-btns">
      <button data-dx="0" data-dy="-32" title="up">&#8593;</button>
      <button data-dx="-32" data-dy="0" title="left">&#8592;</button>
      <button data-dx="32" data-dy="0" title="right">&#8594;</button>
      <button data-dx="0" data-dy="32" title="down">&#8595;</button>
    </div>
    <button id="rpMax">Maximize / restore</button>
  </div>

  <div id="movePanel">
    <div class="rp-head">Move window &#183; <span id="movePos"></span></div>
    <div class="rp-btns">
      <button data-mx="0" data-my="-32" title="up">&#8593;</button>
      <button data-mx="-32" data-my="0" title="left">&#8592;</button>
      <button data-mx="32" data-my="0" title="right">&#8594;</button>
      <button data-mx="0" data-my="32" title="down">&#8595;</button>
    </div>
  </div>
</div>

<script src="commandcenter.js"></script>
</body>
</html>
