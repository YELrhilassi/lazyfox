<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lazyfox split view</title>
<style>
  :root {
    --bg: #16161e;
    --panel: #1a1b26;
    --border: #24283b;
    --border-hi: #3b4261;
    --fg: #c0caf5;
    --dim: #565f89;
    --accent: #7aa2f7;
    --amber: #e0af68;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;
  }
  #panes {
    display: flex; height: 100%;
  }
  .pane { position: relative; min-width: 60px; min-height: 60px; flex: 1 1 0; overflow: hidden; }
  .pane iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .pane.active { outline: 1px solid var(--accent); outline-offset: -1px; z-index: 1; }
  .divider {
    flex: none; width: 1px; cursor: col-resize;
    background: var(--border-hi);
  }
  .divider:hover { background: var(--accent); }
</style>
</head>
<body>
  <div id="panes"></div>
<script src="splitview.js"></script>
</body>
</html>
