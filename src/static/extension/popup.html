<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Lazyfox</title>
<style>
  :root {
    --bg: #161922; --bg2: #1d2130; --fg: #d3d7e6; --muted: #5f6a85;
    --accent: #6d8fdb; --border: #262b3d; --border2: #343b54; --sel: #2b3150;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; width: 220px; }
  .title { padding: 9px 14px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--border); }
  .item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; font-size: 13px; }
  .item:hover { background: var(--sel); }
  .kbd { display: inline-block; min-width: 22px; text-align: center; background: var(--bg2); border: 1px solid var(--border2); border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; color: var(--accent); font-size: 11px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .sep { height: 1px; background: var(--border); margin: 4px 0; }
</style>
</head>
<body>
  <div class="title">Lazyfox</div>
  <div class="item" data-open="search"><span class="kbd">s</span> Search</div>
  <div class="item" data-open="tabs"><span class="kbd">t</span> Tabs</div>
  <div class="item" data-open="history"><span class="kbd">h</span> History</div>
  <div class="item" data-open="bookmarks"><span class="kbd">b</span> Bookmarks</div>
  <div class="item" data-open="downloads"><span class="kbd">d</span> Downloads</div>
  <div class="sep"></div>
  <div class="item" data-open="settings"><span class="kbd">S</span> Firefox settings</div>
  <div class="item" data-open="zen"><span class="kbd">z</span> Zen mode</div>
  <div class="item" data-open="options"><span class="kbd">o</span> Lazyfox options</div>

<script src="popup.js"></script>
</body>
</html>
