<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lazyfox split view</title>
<style>
  :root {
    --bg: #16161e;
    --panel: #1e1e2e;
    --border: #2a2f45;
    --border-hi: #414868;
    --fg: #c0caf5;
    --dim: #565f89;
    --accent: #7aa2f7;
    --cyan: #2ac3de;
    --amber: #e0af68;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;
  }
  #bar {
    display: flex; align-items: center; gap: 12px;
    height: 30px; padding: 0 10px; flex: none;
    background: linear-gradient(180deg, rgba(26,27,38,.98), rgba(20,20,30,.98));
    border-bottom: 1px solid var(--border);
    font-size: 11px; user-select: none;
  }
  #bar .glyph { color: var(--cyan); font-size: 13px; }
  #bar .orient { color: var(--dim); letter-spacing: .12em; text-transform: uppercase; font-size: 9px; }
  #bar .orient b { color: var(--amber); }
  #tabs { display: flex; align-items: center; gap: 4px; overflow: hidden; }
  .pane-tab {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(65,72,104,.12); border: 1px solid transparent;
    border-radius: 5px; padding: 2px 8px; cursor: pointer; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px;
  }
  .pane-tab .n { color: var(--cyan); font-weight: 600; }
  .pane-tab.on { color: var(--fg); border-color: var(--border-hi); background: rgba(122,162,247,.10); }
  .pane-tab.on .n { color: var(--accent); }
  .pane-tab .x { color: var(--dim); }
  .pane-tab .x:hover { color: #f7768e; }
  #addr {
    flex: 1; display: flex; align-items: center; gap: 6px; min-width: 120px;
  }
  #addr input {
    flex: 1; background: var(--panel); color: var(--fg);
    border: 1px solid var(--border-hi); border-radius: 5px;
    padding: 2px 8px; font-family: inherit; font-size: 11px; outline: none;
  }
  #addr input:focus { border-color: var(--accent); }
  #hint { color: var(--dim); font-size: 10px; white-space: nowrap; }
  #hint .kbd { color: var(--accent); }
  #panes {
    display: flex; height: calc(100% - 30px);
  }
  #panes.vertical { flex-direction: column; }
  .pane { position: relative; min-width: 60px; min-height: 60px; flex: 1 1 0; overflow: hidden; }
  .pane iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .pane.active { outline: 2px solid rgba(122,162,247,.55); outline-offset: -2px; z-index: 1; }
  .divider {
    flex: none; width: 4px; cursor: col-resize;
    background: var(--border); transition: background .12s ease;
  }
  #panes.vertical .divider { width: auto; height: 4px; cursor: row-resize; }
  .divider:hover { background: var(--accent); }
  .empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 12px; background: var(--panel);
  }
</style>
</head>
<body>
  <div id="bar">
    <span class="glyph">&#x29C9;</span>
    <span class="orient">split <b id="orient">side-by-side</b></span>
    <span id="tabs"></span>
    <span id="addr"><input id="addrInput" placeholder="type a URL for this pane, Enter to load" spellcheck="false"></span>
    <span id="hint"><span class="kbd">;</span> <span class="kbd">[</span>/<span class="kbd">]</span> pane &middot; <span class="kbd">;\\</span> close</span>
  </div>
  <div id="panes"></div>
<script src="splitview.js"></script>
</body>
</html>
