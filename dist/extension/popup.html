<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Lazyfox</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="title">Lazyfox</div>
  <div class="item" data-open="search"><span class="kbd">s</span> Search</div>
  <div class="item" data-open="tabs"><span class="kbd">t</span> Tabs</div>
  <div class="item" data-open="history"><span class="kbd">h</span> History</div>
  <div class="item" data-open="bookmarks"><span class="kbd">b</span> Bookmarks</div>
  <div class="item" data-open="downloads"><span class="kbd">d</span> Downloads</div>
  <div class="sep"></div>
  <div class="item" data-open="settings"><span class="kbd">S</span> Firefox settings</div>
  <div class="item" data-open="zen"><span class="kbd">z</span> Zen mode</div>
  <div class="item" data-open="options"><span class="kbd">o</span> Lazyfox options</div>

<script src="popup.js"></script>
</body>
</html>
