name: Dev Nightly - CI

# Read-only verification of the UNSIGNED dev build on every push/PR to
# dev-nightly: Go core + installer unit tests + dist completeness.
#
# This workflow NEVER writes to the repo, pushes, tags, or publishes — it only
# builds and tests. It is intentionally single-job (free-plan time budget):
# the full WebDriver BiDi e2e suite is run locally instead of on CI.
#
#   bash scripts/install-tools.sh geckodriver   # one-time
#   npm run bidi                                # the full e2e suite locally
#   npm run probe:chrome                        # the real chrome-layer probe

on:
  push:
    branches: [dev-nightly]
  pull_request:
    branches: [dev-nightly]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Repo modules (root + installer) require Go 1.26; must match go.mod.
          go-version: "1.26"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build dev extension (unsigned)
        run: npm run build

      - name: Run full unit suite
        run: npm test

      - name: Verify dist is self-contained
        run: node scripts/check-dist.mjs