name: Dev Nightly - CI

# Runs the FAST checks on the UNSIGNED dev build for every push to
# dev-nightly and on PRs: Go core + installer unit tests + dist completeness.
#
# This is intentionally single-job and thin. The full WebDriver BiDi
# end-to-end suite is heavyweight and long-running, and does not fit GitHub's
# free-plan minutes, so it is NOT run here. Run it locally instead:
#
#   bash scripts/install-tools.sh geckodriver   # one-time
#   npm run bidi                                # the full e2e suite
#   npm run probe:chrome                        # the real chrome-layer probe
#
# See docs/CI.md for the complete local-testing story.

on:
  push:
    branches: [dev-nightly]
  pull_request:
    branches: [dev-nightly]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Repo modules (root + installer) require Go 1.26; must match go.mod.
          go-version: "1.26"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build dev extension (unsigned)
        run: npm run build

      - name: Run full unit suite
        run: npm test

      - name: Verify dist is self-contained
        run: node scripts/check-dist.mjs