name: Dev Nightly - Auto-test on Firefox Nightly

# Runs the full Lazyfox test matrix against the UNSIGNED dev build on push to
# dev-nightly and on PRs: unit tests (Go core + installer + dist completeness)
# then the end-to-end WebDriver BiDi suite on a fresh Firefox Nightly.
#
# The extension is installed by the suite itself via WebDriver (temporary
# add-on), so the workflow only needs a Firefox binary + geckodriver: Firefox
# comes from browser-actions/setup-firefox (channel=nightly), geckodriver is
# downloaded from the mozilla/geckodriver release matching the local one.

on:
  push:
    branches: [dev-nightly]
  pull_request:
    branches: [dev-nightly]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Repo modules (root + installer) require Go 1.26; must match go.mod.
          go-version: "1.26"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build dev extension (unsigned)
        run: npm run build

      - name: Run full unit suite
        run: npm test

      - name: Verify dist is self-contained
        run: node scripts/check-dist.mjs

  bidi:
    name: BiDi end-to-end (Nightly)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Repo modules (root + installer) require Go 1.26; must match go.mod.
          go-version: "1.26"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build dev extension (unsigned)
        run: npm run build

      - name: Setup Firefox Nightly
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-nightly

      - name: Download geckodriver
        run: |
          mkdir -p .tools
          curl -fsSL -o /tmp/geckodriver.tar.gz \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf /tmp/geckodriver.tar.gz -C .tools
          chmod +x .tools/geckodriver
          ./.tools/geckodriver --version

      - name: Run BiDi test suite
        env:
          FIREFOX_BIN: "${{ steps.setup-firefox.outputs.firefox-path }}"
          GECKODRIVER: ".tools/geckodriver"
        run: |
          FIREFOX_BIN="$FIREFOX_BIN" GECKODRIVER="$GECKODRIVER" BIDI_HEADLESS=1 \
            timeout 600 node scripts/bidi/test.mjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-bidi-results
          path: /tmp/bidi*.log