name: Installers - native builds

# Builds the Lazyfox installer ON each platform, so every one gets the real
# graphical installer window.
#
# Why this job exists: the window is the operating system's own webview, and
# Wails' macOS and Linux backends reach it through CGO and the system webkit
# libraries. Those binaries cannot be cross-compiled, so the one-machine release
# flow produces the terminal installer for the platforms it is not running on.
# This workflow fills that gap natively.
#
# It uploads workflow artifacts only. Releases are still created by exactly one
# place (`npm run ship`); this job never pushes, tags or publishes.
#
# Each artifact contains the platform's dev AND stable installers AND the
# payload-state.json the build wrote beside them. The state file is the record
# that lets `npm run check` prove, in a fresh clone and without rebuilding,
# which payload a committed binary carries — so a maintainer who wants to commit
# a CI-built binary has the record that goes with it instead of having to
# hand-write one.
#
# With `release: true` the job runs the RELEASE build (`node scripts/
# release-build.ts`) instead of the dev build. It must be dispatched on MASTER
# and only there: the release build embeds an AMO-signed add-on, which it takes
# from the signed xpi committed on master (sync-signed-xpi.ts reuses it offline,
# no credentials needed) — a release build on a dev branch would find an
# unsigned canonical xpi and stop. Run it after master carries the merged dev
# source, when the committed linux/mac installers that ship() can only
# cross-compile from one machine must be rebuilt as the genuine graphical
# window, on release-mode dist, for a release refresh.

on:
  # MANUAL, AND DELIBERATELY. Three native builds (Linux, macOS, Windows) are
  # not something every dev push should spend: the binaries are rebuilt from the
  # current payload before a release anyway (`npm run build`, which refreshes
  # every committed installer locally), and this workflow is here for the case
  # where one of them must be produced on the platform itself. A push that needs
  # verification is a push to master — see master.yml.
  workflow_dispatch:
    inputs:
      release:
        description: "Release build (release-mode dist + signed add-on) — dispatch on MASTER only"
        type: boolean
        default: false
        required: false

jobs:
  installer:
    name: ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Each artifact carries BOTH channels' binaries for the platform: the dev
      # installer (unsigned add-on) and the stable one (signed add-on, when one
      # is present in dist/). The dev builds from one machine are cross-compiled
      # terminal installers — this job is what replaces them with the graphical
      # window, and having both channels here means neither has to be re-built
      # cross-platform ever again.
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            artifact: lazyfox-install-linux
            bin: |
              installer/bin/lazyfox-install-linux-*
              installer/bin/lazyfox-install-linux-*.AppImage
              installer/bin/lazyfox-install-dev-linux-*
              installer/bin/lazyfox-install-dev-linux-*.AppImage
              # The pure-Go TUI fallback for machines without WebKitGTK lives
              # beside the GUI binary in the same artifact (dev + stable), and
              # the fully bundled AppImage (its own WebKitGTK + helper
              # processes) is packaged below from that GUI binary.
          # macos-15, deliberately: the macos-14 image browned out and was
          # retired on 2026-11-02 (actions/runner-images#13518) — dispatches
          # failed with "scheduled image brownout" inside a second, killing the
          # darwin artifact (the WKWebView graphical installer) before a build
          # could even start. Anything past macos-15 must re-verify the WKWebView
          # backend, not assume it carries over unchanged.
          - os: macos-15
            name: darwin
            artifact: lazyfox-install-darwin
            bin: |
              installer/bin/lazyfox-install-darwin-*
              installer/bin/lazyfox-install-dev-darwin-*
          - os: windows-2022
            name: windows
            artifact: lazyfox-install-windows.exe
            bin: |
              installer/bin/lazyfox-install-windows-*.exe
              installer/bin/lazyfox-install-dev-windows-*.exe
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Repo modules require Go 1.26; must match go.mod — AND the patch must
          # match the machine that builds the committed dev installers, because
          # the Go compiler version is inside the payload it stamps (dist/'s
          # core.wasm bytes differ between 1.26.5 and 1.26.7, and with them the
          # payload hash every installer binary embeds). A floating "1.26"
          # resolved to 1.26.7 here and made every CI-built binary disagree on
          # payload with the same source built locally.
          go-version: "1.26.5"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # From the window's own lockfile, rather than letting the build's
      # ensureFrontend() run `npm install` and resolve a fresh (and therefore
      # different) dependency tree on every run.
      - name: Install the installer window's dependencies
        run: npm run ui:deps

      # Wails' Linux backend links WebKitGTK through CGO. The pkg-config name
      # Wails v2 builds against is webkit2gtk-4.0 (its 4.1 sibling breaks the
      # build with "Package 'webkit2gtk-4.0', required by 'virtual:world',
      # not found"), so the dev package installed must be the 4.0 one.
      # patchelf is linuxdeploy's dependency-deploy tool; xvfb runs the packaged
      # AppImage's GUI smoke test without a display server.
      - name: Install webview build dependencies (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev patchelf xvfb

      # One command: dist/, the add-on, and every committed installer
      # (this platform's with its graphical window, the others as terminal
      # installers, plus the release set when a signed add-on is present).
      # `release: true` switches to the RELEASE build: release-mode dist
      # (__DEV__=false), the AMO-signed canonical xpi (reused offline from the
      # signed xpi committed on master), and installer binaries rebuilt from
      # both — so a committed binary embeds the same release payload master
      # shipped, byte for byte.
      - name: Build dist, the add-on and the installers
        # bash, not the runner default: on windows that is PowerShell, which
        # cannot parse `if [ … ]` — the windows job died at parse time and
        # produced no artifact while linux/darwin succeeded.
        shell: bash
        run: |
          if [ "${{ inputs.release }}" = "true" ]; then
            node scripts/release-build.ts
          else
            npm run build
          fi

      # Diagnostic, not a gate: every job builds the same commit, but the linux
      # and macos runners have produced a different payload hash than windows
      # (and the local checkout) with the SAME pinned Go — which means one of
      # the payload's input files is built env-dependently. If this surfaces
      # again, diffing two jobs' manifests pinpoints the file; the digests go
      # into the job log with the manifest's sha256 as the one-line summary.
      - name: Dump the payload manifest
        run: node scripts/dump-payload-manifest.ts

      # macOS's graphical installer is the native WKWebView binary. It must
      # answer a non-interactive request with a usable embedded payload — the
      # same content check the workflow already ran, now on the REAL artifact
      # the release will publish, from the platform it was built for.
      - name: Verify the darwin GUI binary runs
        if: matrix.name == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          channel=""; [ "${{ inputs.release }}" = "true" ] || channel="-dev"
          bin=$(ls installer/bin/lazyfox-install${channel}-darwin-* | head -n 1)
          cp "$bin" /tmp/darwin-check
          out=$(/tmp/darwin-check --mode list 2>&1) || true
          printf '%s\n' "$out"
          if ! printf '%s' "$out" | grep -q 'add-on payload : present'; then
            echo "$out"
            echo "the darwin GUI binary does not report a usable payload"
            exit 1
          fi
          echo "the darwin GUI binary reports a usable embedded payload"

      # The upload is not the verification. This is: the binaries just built are
      # re-checked by content (payload hash, source fingerprint, staged payload,
      # and this machine's binary actually running with a usable embedded
      # payload) before they are offered to anyone.
      # The freshly built wasm core is uploaded from one job as well: with the
      # SAME pinned go 1.26.5 and identical flags (-buildvcs=false -trimpath
      # -ldflags="-s -w"), the windows runner produced different wasm bytes than
      # the linux/darwin runners (measured: 25341862... vs 6f337c11...), and
      # corebootstrap.js — the payload input that embeds it — drifted with it.
      # Uploading the file lets the two byte streams be diffed locally to find
      # which part of the wasm is host-OS-dependent.
      - name: Upload the fresh core.wasm
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: fresh-core-wasm-linux
          path: core/js/core.wasm
          if-no-files-found: error

      - name: Verify the binaries that were just built
        run: node scripts/check-installer-payload.ts

      # Linux's PUBLISHED graphical installer is the fully bundled AppImage:
      # its own WebKitGTK + the WebKitWebProcess/WebKitNetworkProcess helpers
      # that a linked libwebkit spawns from a path baked into the library, so
      # `libwebkit2gtk cannot open shared object file` (a desktop without the
      # 4.0 package) can no longer happen. Package the JUST-BUILT GUI binary,
      # then prove the AppImage headlessly: `--mode list` on a machine with the
      # host webkit packages REMOVED — a failed bundle there is a hard stop,
      # because a walled-garden-only dark-empty-window is what users report
      # otherwise. The AppImage file name carries the embedded add-on version.
      # (macOS needs no such wrapper: WKWebView is part of the OS; the raw
      # binary IS the graphical installer and the smoke test below exercises it
      # directly.)
      - name: Package the Linux AppImage (bundled WebKitGTK)
        if: matrix.name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          channel=""; [ "${{ inputs.release }}" = "true" ] || channel="-dev"
          prefix="lazyfox-install${channel}-linux"
          bin=$(ls installer/bin/${prefix}-* | grep -v -- '-tui-' | head -n 1)
          version=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/extension/manifest.json','utf8')).version)")
          # Remove the host's own WebKitGTK so the gate below cannot silently
          # pass on the RUNNER's packages (the version-skew trap documented in
          # packaging AppImages: the host helper dir gets used as if it were
          # the bundle). Name the packages by what dpkg actually has installed:
          # jammy publishes libwebkit2gtk-4.0-37, not -38, and a remove of a
          # non-existing name is an error silently skipped — the one state that
          # makes the no-webkit gate a lie. The binaries are already verified
          # and uploaded above.
          webkit_pkgs="$(dpkg-query -W -f='${binary:Package}\n' 2>/dev/null | grep '^libwebkit2gtk' || true)"
          if [ -n "$webkit_pkgs" ]; then
            sudo apt-get purge -y $webkit_pkgs || sudo dpkg -P --force-all $webkit_pkgs || sudo dpkg -r --force-all $webkit_pkgs || true
          fi
          if ldconfig -p 2>/dev/null | grep -q 'libwebkit2gtk'; then
            echo "host WebKitGTK is still installed after the purge — the no-webkit gate below cannot be trusted"
            exit 1
          fi
          echo "no host WebKitGTK remains — the gate below proves the bundle alone"
          installer/scripts/package-appimage.sh --bin "$bin" --out "installer/bin/${prefix}-${version}.AppImage"

      # The headless gate, after the packaging step's own `--mode list`: open
      # the REAL window on Xvfb and expect the timeout kill (124). Anything
      # else — a crash, a clean early exit — means the webview did not come up,
      # and that is exactly the defect this pipeline exists to catch before a
      # user reports it.
      - name: Smoke the AppImage GUI headlessly
        if: matrix.name == 'linux'
        shell: bash
        run: |
          set -uo pipefail
          appimg=$(ls installer/bin/*.AppImage | head -n 1)
          timeout 90 xvfb-run -a "$appimg" --appimage-extract-and-run >/dev/null 2>&1
          rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "the AppImage GUI window stayed alive for the full timeout — packaged correctly"
          else
            echo "the AppImage GUI exited early with code $rc — see the output above"
            exit 1
          fi

      - name: Upload this platform's installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Built binaries carry the add-on version in their name, so the upload
          # is a glob; check-installer-payload has already verified the file it
          # matches. The AppImage is the packaged form of that same just-built
          # binary — the overlay (`scripts/native-installers.ts`) is what
          # carries it into installer/bin/ — so it rides the same artifact.
          path: |
            ${{ matrix.bin }}
            installer/bin/payload-state.json
          if-no-files-found: error
