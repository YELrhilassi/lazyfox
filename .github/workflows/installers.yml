name: Installers - native builds

# Builds the Lazyfox installer ON each platform, so every one gets the real
# graphical installer window.
#
# Why this job exists: the window is the operating system's own webview, and
# Wails' macOS and Linux backends reach it through CGO and the system webkit
# libraries. Those binaries cannot be cross-compiled, so the one-machine release
# flow produces the terminal installer for the platforms it is not running on.
# This workflow fills that gap natively.
#
# It uploads workflow artifacts only. Releases are still created by exactly one
# place (`npm run ship`); this job never pushes, tags or publishes.
#
# Each artifact contains the platform's dev installer AND the payload-state.json
# the build wrote beside it. The state file is the record that lets `npm run
# check` prove, in a fresh clone and without rebuilding, which payload a
# committed binary carries — so a maintainer who wants to commit a CI-built
# binary has the record that goes with it instead of having to hand-write one.

on:
  # MANUAL, AND DELIBERATELY. Three native builds (Linux, macOS, Windows) are
  # not something every dev push should spend: the binaries are rebuilt from the
  # current payload before a release anyway (`npm run build`, which refreshes
  # every committed installer locally), and this workflow is here for the case
  # where one of them must be produced on the platform itself. A push that needs
  # verification is a push to master — see master.yml.
  workflow_dispatch:

jobs:
  installer:
    name: ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            artifact: lazyfox-install-dev-linux
            bin: installer/bin/lazyfox-install-dev-linux-*
          - os: macos-14
            name: darwin
            artifact: lazyfox-install-dev-darwin
            bin: installer/bin/lazyfox-install-dev-darwin-*
          - os: windows-2022
            name: windows
            artifact: lazyfox-install-dev-windows.exe
            bin: installer/bin/lazyfox-install-dev-windows-*.exe
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Repo modules (root + installer) require Go 1.26; must match go.mod.
          go-version: "1.26"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # From the window's own lockfile, rather than letting the build's
      # ensureFrontend() run `npm install` and resolve a fresh (and therefore
      # different) dependency tree on every run.
      - name: Install the installer window's dependencies
        run: npm run ui:deps

      # Wails' Linux backend links WebKitGTK through CGO.
      - name: Install webview build dependencies (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # One command: dist/, the unsigned add-on, and every committed installer
      # (this platform's with its graphical window, the others as terminal
      # installers, plus the release set when a signed add-on is present).
      - name: Build dist, the add-on and the installers
        run: npm run build

      # The upload is not the verification. This is: the binaries just built are
      # re-checked by content (payload hash, source fingerprint, staged payload,
      # and this machine's binary actually running with a usable embedded
      # payload) before they are offered to anyone.
      - name: Verify the binaries that were just built
        run: node scripts/check-installer-payload.ts

      - name: Upload this platform's installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Built binaries carry the add-on version in their name, so the upload
          # is a glob; check-installer-payload has already verified the file it
          # matches.
          path: |
            ${{ matrix.bin }}
            installer/bin/payload-state.json
          if-no-files-found: error
