name: Nightly - link hints on real pages

# A scheduled run that downloads real UI-heavy page snapshots (GitHub, YouTube)
# and exercises the link-hint engine against markup it did not author — the
# fixture-backed stress test in scripts/bidi/suites/content.ts.
#
# Kept OUT of the push/PR workflows on purpose (see docs/CI.md): it boots a real
# Firefox, which is too slow to gate every push on GitHub's free minutes. It is
# also deliberately fault-tolerant:
#
#   * the snapshot download is best-effort (`continue-on-error`). If the network
#     is blocked the run continues and the stress test simply skips, so an
#     offline run is never a false failure;
#   * the rest of the link-hint tests use local fixtures and always run;
#   * `BIDI_REQUIRE_FIXTURES` is set to 1 ONLY when the download actually
#     succeeded, so a silently broken download cannot hide behind a skip.

on:
  schedule:
    # 04:23 UTC daily (off the hour to avoid the scheduler stampede).
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hints:
    name: Link hints (real pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Repo modules (root + installer) require Go 1.26; must match go.mod.
          go-version: "1.26"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # Build from source so the nightly tests the branch, not a stale dist/.
      - name: Build dev extension (unsigned)
        run: npm run build

      # geckodriver + Firefox are pinned as a matched pair: bump both together
      # (a geckodriver older than the Firefox it drives refuses the session).
      - name: Install geckodriver
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/geckodriver.tar.gz \
            "https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz"
          mkdir -p .tools
          tar -xzf /tmp/geckodriver.tar.gz -C .tools geckodriver
          chmod +x .tools/geckodriver
          .tools/geckodriver --version

      - name: Install Firefox (ESR 140)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/firefox.tar.xz \
            "https://ftp.mozilla.org/pub/firefox/releases/140.16.0esr/linux-x86_64/en-US/firefox-140.16.0esr.tar.xz"
          mkdir -p "$HOME/firefox"
          tar -xJf /tmp/firefox.tar.xz -C "$HOME"
          echo "FIREFOX_BIN=$HOME/firefox/firefox" >> "$GITHUB_ENV"
          "$HOME/firefox/firefox" --version

      - name: Fetch real-page snapshots (best effort)
        id: fixtures
        continue-on-error: true
        run: npm run bidi:fixtures

      - name: Link-hint tests (real-page stress when snapshots are present)
        env:
          BIDI_HEADLESS: "1"
          # "success"/"failure" from the best-effort step above.
          BIDI_REQUIRE_FIXTURES: ${{ steps.fixtures.outcome == 'success' }}
        run: node scripts/bidi/test.ts --suite content --only "link hints:"
