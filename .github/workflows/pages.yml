name: Site - GitHub Pages

# Publishes site/ (the product page) as a GitHub Pages site.
#
# It is its own workflow on purpose: the page is a Vite app with its own
# package.json and lockfile, and nothing in it can affect `npm run build`,
# `npm test` or the release. Publishing is therefore a separate, reversible
# event: the artifact lives under github-pages and unpublishing (or deleting
# the deployment) leaves the repository untouched.
#
# ONE-TIME SETUP, in the repository: Settings → Pages → Build and deployment →
# Source = "GitHub Actions". Without that the deploy job fails at
# actions/configure-pages with "Get Pages site failed".
#
# SITE_URL must agree with site/config.mjs and with where the site really lives:
# a project site is served from /<repo>/, and the bundle's base path is derived
# from that URL. Moving to a custom domain means changing this value and the
# default in site/config.mjs together.

on:
  push:
    branches: [master, dev-nightly]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build (prerendered static HTML)
        working-directory: site
        run: npm run build
        env:
          # The one deployment fact: the base path and every absolute URL in the
          # document are derived from it (site/config.mjs).
          SITE_URL: https://yelrhilassi.github.io/lazyfox

      - name: Check the page is really static
        working-directory: site
        # The build prerenders the markup, so the assertion that matters is that
        # the served document holds the copy — not an empty <div id="root">.
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          grep -q "Firefox, with the" dist/index.html
          if grep -q "<!--app-->" dist/index.html; then
            echo "::error::index.html was not prerendered"
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
