name: Master CI - Read-only verification

# Read-only verification of master. Releases ARE NOT created here.
#
# The release is created by `npm run ship` (run by a maintainer from a dev
# branch), which: merges the dev branch into master with `-X theirs`, syncs the
# AMO-signed xpi, rebuilds the release installers, and pushes master + the
# v<version> tag + creates the GitHub Release. That push is what triggers this
# workflow.
#
# So this job only verifies the pushed master state (rebuild from source to
# prove it compiles, then the full unit suite + dist self-containment check). It
# NEEDS no AMO secrets and NEVER writes back, tags, or pushes — the tag and
# GitHub Release are created by `ship`, exactly once.

on:
  push:
    branches: [master]

jobs:
  verify:
    name: Verify master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Repo modules (root + installer) require Go 1.26; must match go.mod.
          go-version: "1.26"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build release-mode sources (compiles check)
        # RELEASE=1 builds the release-mode dist WITHOUT contacting AMO for the
        # signed xpi (sync-signed-xpi.ts reuses the committed signed xpi when
        # it is already current, so it is offline-safe here).
        run: npm run build:release

      - name: Run full unit suite
        run: npm test